# src/ root ownership manifest — the P2a root-freeze.
#
# Every entry at the top level of src/ is registered here with its FINAL
# owner. This file freezes ownership only: it moves no code and changes no
# behavior. tests/src-root-growth.test.py enforces it as a ratchet — a new
# src/ root module that is not registered here fails the suite.
#
# Categories:
#   sutando       core personal-agent logic; stays in src/ permanently
#   ag2-sparrow   delivery/transport whose canonical home becomes the
#                 ag2-sparrow package (ownership inversion happens in later,
#                 separate PRs — registering here does NOT move anything)
#   integration   provider adapters / edge wiring that binds concrete
#                 channels to the shared cores
#   policy        authorization, redaction, guardrail, envelope policy
#   compatibility transition shims and aliases (see shim census below)
#   entrypoint    launch, supervision, install, lifecycle scripts
#   retire        slated for deletion; kept only until consumers are gone
#
# Migration debt (explicit): packages/ag2-sparrow/tools/sync_from_src.py —
# the vendored-twin copier. It exists only while src/ remains the canonical
# side of outbox.py / outbox_adapter.py / result_markers.py; the B/C1
# ownership inversions retire it. Do not grow its file list.

