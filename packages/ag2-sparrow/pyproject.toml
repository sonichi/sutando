[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ag2-sparrow"
# Single-sourced from ag2_sparrow.__version__ (see [tool.setuptools.dynamic]) so the
# packaged dist version and the importable __version__ can never drift.
dynamic = ["version"]
description = "A channel-neutral local delivery runtime for AI agents: durable task and event transport, plus a transactional-outbox delivery-core library (crash-safe claims, recovery, provider adapters)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AG2 Space" }]
keywords = ["ag2", "agent", "relay", "gateway", "matrix", "delivery", "outbox", "runtime"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Intended Audience :: Developers",
]
# Zero third-party runtime deps — the client is stdlib-only (urllib/json/...).
dependencies = []

[project.urls]
Homepage = "https://ag2.space"
Source = "https://github.com/sonichi/sutando"

[project.optional-dependencies]
# Meta Hatch adapter (ag2_sparrow/adapters/hatch): stdlib-only, so the extra
# only names the feature; `ag2-sparrow-hatch install` sets it up.
hatch = []

[project.scripts]
ag2-sparrow = "ag2_sparrow.remote_gateway_bridge:main"
# Separate entry, not a subcommand: remote_gateway_bridge.main() reads no
# argv, so every current invocation starts the bridge and any dispatcher
# would change one of them.
ag2-sparrow-outbox = "ag2_sparrow.outbox_cli:main"
ag2-sparrow-hatch = "ag2_sparrow.adapters.hatch.cli:main"

# Discovered, not listed: a hand-written list silently drops a new subpackage.
[tool.setuptools.packages.find]
where = ["."]
include = ["ag2_sparrow*"]

# Non-Python files the Hatch adapter installs; they must ship in the wheel.
[tool.setuptools.package-data]
"ag2_sparrow.adapters.hatch" = ["*.sh", "*.json"]
"ag2_sparrow.adapters.claude_routine" = ["*.md"]

[tool.setuptools.dynamic]
version = { attr = "ag2_sparrow.__version__" }
