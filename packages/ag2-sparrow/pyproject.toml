[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ag2-sparrow"
# Single-sourced from ag2_sparrow.__version__ (see [tool.setuptools.dynamic]) so the
# packaged dist version and the importable __version__ can never drift.
dynamic = ["version"]
description = "A channel-neutral local delivery runtime for AI agents: durable task and event transport, plus a transactional-outbox delivery-core library (crash-safe claims, recovery, provider adapters)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AG2 Space" }]
keywords = ["ag2", "agent", "relay", "gateway", "matrix", "delivery", "outbox", "runtime"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
]
# Zero third-party runtime deps — the client is stdlib-only (urllib/json/...).
dependencies = []

[project.urls]
Homepage = "https://ag2.space"
Source = "https://github.com/sonichi/sutando"

[project.scripts]
ag2-sparrow = "ag2_sparrow.remote_gateway_bridge:main"
# Separate entry, not a subcommand: remote_gateway_bridge.main() reads no
# argv, so every current invocation starts the bridge and any dispatcher
# would change one of them.
ag2-sparrow-outbox = "ag2_sparrow.outbox_cli:main"

[tool.setuptools]
packages = ["ag2_sparrow"]

[tool.setuptools.dynamic]
version = { attr = "ag2_sparrow.__version__" }
