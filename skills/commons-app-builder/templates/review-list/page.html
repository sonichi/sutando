<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review list</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfd; --card: #fff; --ink: #16161a; --dim: #5d5d6b;
    --line: #e3e3ea; --accent: #2f5bea; --warn: #8a5a00; --bad: #b3261e; --good: #06813D;
    --todo: #B7B2AD; --done: #06813D;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111115; --card: #1a1a20; --ink: #f2f2f5; --dim: #a6a6b4;
      --line: #2c2c36; --accent: #7d9bff; --warn: #ffcf70; --bad: #ff8a80; --good: #9EE2BF;
      --todo: #B7B2AD; --done: #9EE2BF;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 19px; margin: 0 0 2px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 12px; overflow-wrap: anywhere; }
  .note { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin-bottom: 10px; font-size: 14px; }
  .note.bad { border-color: var(--bad); color: var(--bad); }
  .note.warn { border-color: var(--warn); color: var(--warn); }
  .add, .who { display: grid; gap: 8px; margin-bottom: 14px; }
  .who { color: var(--dim); font-size: 13px; }
  .who[hidden] { display: none; }
  input, select, button {
    font: inherit; color: inherit; min-height: 44px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); padding: 0 12px; min-width: 0;
  }
  button { min-height: 44px; min-width: 44px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button[disabled] { opacity: .55; cursor: not-allowed; }
  .items { display: grid; gap: 10px; list-style: none; margin: 0; padding: 0; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
  .top { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; min-width: 0; }
  .name { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); white-space: nowrap; }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--todo)); }
  .chip.done { --dot: var(--done); }
  /* Notes and links are other people's text: a long token must wrap, not widen the page. */
  .meta { color: var(--dim); font-size: 13px; margin-top: 6px; overflow-wrap: anywhere; min-width: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  /* What came back from asking: said in words, never by colour alone. */
  .asked { font-size: 13px; margin-top: 8px; overflow-wrap: anywhere; color: var(--dim); }
  .asked.ok { color: var(--good); }
  .asked.warn { color: var(--warn); }
  .asked.bad { color: var(--bad); }
  @media (min-width: 640px) { .add { grid-template-columns: 2fr 2fr auto; align-items: start; } .who { grid-template-columns: auto 1fr; align-items: center; } }
</style>
</head>
<body>
<h1>Review list</h1>
<div class="sub" id="sub">Loading…</div>
<div id="notes"></div>
<div class="who" id="who" hidden>
  <label for="agent">Ask this agent of yours</label>
  <select id="agent"></select>
</div>
<div class="add">
  <input id="title" placeholder="What should be reviewed?" aria-label="Item" autocomplete="off">
  <input id="note" placeholder="Notes (optional)" aria-label="Notes" autocomplete="off">
  <button class="primary" id="add" disabled>Add item</button>
</div>
<ul class="items" id="list"></ul>
<script>
(async () => {
  const art = window.artifact;
  const db = art && art.db;
  const $ = (id) => document.getElementById(id);
  const notes = $('notes');
  const show = (cls, text) => {
    const el = document.createElement('div');
    el.className = 'note ' + cls;
    el.textContent = text;
    notes.appendChild(el);
  };
  const clearNotes = () => { notes.textContent = ''; };
  let hintShown = false;
  const hint = (text) => { if (!hintShown) { hintShown = true; show('warn', text); } };

  if (!db) {
    $('sub').textContent = 'Preview';
    show('warn', 'Open this page in s.space to use it: this is a preview with no data.');
    $('add').disabled = true;
    return;
  }
  await art.ready;

  // GUIDE step 3: never hard-code a database id.
  const byName = (list, name) => (list.find((d) => d.name === name) || {}).id;
  let dbs = [];
  try { dbs = await db.list(); } catch (e) { show('bad', e.message); return; }
  const id = (art.app && art.app.database) || byName(dbs, 'Review — Items');
  if (!id) { $('sub').textContent = ''; show('bad', 'The "Review — Items" database is missing from this room.'); $('add').disabled = true; return; }

  const save = async (call) => {
    const until = Date.now() + 120000;
    for (;;) {
      const r = await call();
      if (r.ok || !/waiting for the viewer|rate limit|too many/i.test(r.reason || '') || Date.now() > until) return r;
      hint('Allow this page to edit data in this room, and it will save.');
      await new Promise((ok) => setTimeout(ok, 1500));
    }
  };

  /* ---- asking the viewer's own agent (GUIDE: "A button that asks the viewer's own agent") ---- */
  // An older room has no agent calls: the buttons are then left out, not shown dead.
  const agentApi = art.agent;
  const canAsk = !!(agentApi && typeof agentApi.list === 'function' && typeof agentApi.sendTask === 'function');
  let agents = [];
  const loadAgents = async () => {
    let list = [];
    try { list = await agentApi.list(); } catch (e) { list = []; }
    agents = Array.isArray(list) ? list.filter((a) => a && typeof a.id === 'string') : [];
    const sel = $('agent');
    const want = sel.value;
    sel.textContent = '';
    agents.forEach((a) => {
      const opt = document.createElement('option');
      opt.value = a.id; opt.textContent = a.name || 'Agent';
      sel.appendChild(opt);
    });
    if (agents.some((a) => a.id === want)) sel.value = want;
    $('who').hidden = agents.length < 2;             // one agent needs no picker
    return agents;
  };

  // One line of plain text from a cell. The host refuses a request holding invisible or control
  // characters, so they are removed here and the viewer reads exactly what will be sent.
  const clean = (value, max) => String(value == null ? '' : value)
    .replace(/[\p{Cc}\p{Cf}\p{Co}\p{Cs}\u2028\u2029]/gu, ' ')
    .replace(/\s+/g, ' ').trim().slice(0, max);

  // The text is the whole request: it is what the viewer reads and confirms, and the only thing
  // the agent treats as the ask. It is built from the row, so it says what the row says.
  const askText = (row, title) => {
    const lines = ['Please review this item from the "' + clean((art.app && art.app.name) || 'Review list', 80)
      + '" list and tell me whether to keep it or drop it, and why.', 'Item: ' + clean(title, 300)];
    const note = clean(row.cells.Notes, 1500);
    const link = clean(row.cells.Link, 500);
    if (note) lines.push('Notes: ' + note);
    if (link) lines.push('Link: ' + link);
    return lines.join('\n');
  };

  // A stable key per row, agent and attempt: a double tap or a reload does not ask twice. The
  // host keeps one receipt per key and answers a repeated key from it, with no question and no
  // delivery. So the key must tell apart everything that is a different request: another row,
  // and the same row asked of another agent. Ids are hashed whole, never trimmed or stripped:
  // "a.b" and "ab" are different rows. The attempt moves on only when the viewer cancelled.
  const hash = (text) => {
    let a = 1779033703, b = 3144134277, c = 1013904242, d = 2773480762;
    for (let i = 0; i < text.length; i += 1) {
      const k = text.charCodeAt(i);
      a = b ^ Math.imul(a ^ k, 597399067);
      b = c ^ Math.imul(b ^ k, 2869860233);
      c = d ^ Math.imul(c ^ k, 951274213);
      d = a ^ Math.imul(d ^ k, 2716044179);
    }
    a = Math.imul(c ^ (a >>> 18), 597399067);
    b = Math.imul(d ^ (b >>> 22), 2869860233);
    c = Math.imul(a ^ (c >>> 17), 951274213);
    d = Math.imul(b ^ (d >>> 19), 2716044179);
    return [a ^ b ^ c ^ d, b ^ a, c ^ a, d ^ a]
      .map((n) => (n >>> 0).toString(16).padStart(8, '0')).join('');
  };
  // The length before each id keeps ("ab", "c") and ("a", "bc") apart.
  const slotFor = (rowId, agentId) => hash(String(rowId).length + ':' + rowId + '|' + agentId);
  const attemptsKey = 'ask.' + String((art.me && art.me.id) || 'anon').slice(0, 40);
  let attempts = {};
  try {
    const kept = await Promise.resolve(art.state.get(attemptsKey));
    if (kept && typeof kept === 'object') attempts = Object.assign({}, kept);
  } catch (e) { attempts = {}; }
  const keyFor = (slot) => 'ask.' + slot + '.' + (Number(attempts[slot]) || 0);
  const nextAttempt = async (slot) => {
    attempts[slot] = (Number(attempts[slot]) || 0) + 1;
    // A state value is small: keep the latest fifty rows' counts.
    Object.keys(attempts).slice(0, -50).forEach((old) => { delete attempts[old]; });
    // Best effort: unsaved, the count still holds until this page is reloaded.
    try { await art.state.set(attemptsKey, attempts); } catch (e) { /* kept in memory */ }
  };

  // What a refusal means to the person, by the reason the page is given. The first group is what
  // a room answers today; the second is what it answers once requests go through the room's
  // server. Anything else is shown as it came.
  const REFUSED = Object.assign(Object.create(null), {
    'confirmation interrupted': ['warn', 'Not sent: the question closed before you answered. Tap again to ask.'],
    'too many agent requests': ['warn', 'Too many requests just now. Wait a minute, then tap again.'],
    'too many requests': ['warn', 'Too many requests just now. Wait a minute, then tap again.'],
    'agent not owned or unavailable': ['bad', 'That agent is not yours to ask from here, or it is unavailable.'],
    'page permission required': ['warn', 'Allow this page to use this room, then tap again.'],
    'request timed out; retry with the same key': ['warn', 'No answer yet about whether it was sent. Tap again: it will not be sent twice.'],
    'send outcome unknown': ['warn', 'It may or may not have been sent. Check your chat with the agent before asking again.'],
    'agent task unavailable': ['bad', 'Your agent cannot be reached from this page right now. Try again later.'],
    'idempotency storage unavailable': ['bad', 'This browser cannot keep track of requests, so nothing was sent.'],
    'page task limit reached': ['bad', 'This page has used up its requests on this device.'],
    'invalid request': ['bad', 'This item cannot be sent as it is: it may be too long.'],
    off: ['bad', 'Asking an agent from an app is switched off in this room.'],
    not_an_app: ['bad', 'Open this page as an app in the room to ask an agent from it.'],
    not_yours: ['bad', 'That agent is not yours to ask.'],
    no_owner_dm: ['warn', 'You have no chat with that agent yet. Open a chat with it, then tap again.'],
    rate: ['warn', 'Too many requests just now. Wait a minute, then tap again.'],
    not_deliverable: ['bad', 'That agent cannot receive requests right now.'],
    not_subscribed: ['bad', 'That agent is not set up to take requests from apps.'],
  });
  const asked = new Map();                 // row id -> [class, text]: survives a redraw
  let asking = false;

  const askAbout = async (row, title) => {
    if (asking) return;                    // one question in front of the viewer at a time
    asking = true;
    asked.set(row.id, ['', 'Waiting for you to answer the question…']);
    if (snapshot) draw(snapshot);
    try {
      const list = await loadAgents();
      const agent = list.find((a) => a.id === $('agent').value) || list[0];
      if (!agent) {
        asked.set(row.id, ['warn', 'No agent of yours is available to this page. If the page asked to use this room, allow it, then tap again.']);
        return;
      }
      const slot = slotFor(row.id, agent.id);
      let r = null;
      try {
        r = await agentApi.sendTask({ agentId: agent.id, text: askText(row, title), key: keyFor(slot) });
      } catch (e) { r = { ok: false, reason: 'agent task unavailable' }; }
      if (r && r.ok === true) {
        asked.set(row.id, ['ok', 'Sent to ' + clean(agent.name || 'your agent', 60) + '. The answer comes to your chat with it, not to this page.']);
        return;
      }
      const reason = String((r && r.reason) || '');
      if (reason === 'declined') {
        await nextAttempt(slot);           // a cancelled request is over: the next tap is a new one
        asked.set(row.id, ['', 'Not sent: you cancelled. Tap again to ask.']);
        return;
      }
      // A reason this page does not know may mean "not sent" or "not known": it claims neither.
      asked.set(row.id, REFUSED[reason] || ['bad', 'No confirmation that it was sent (' + (clean(reason, 80) || 'no reason given') + ').']);
    } finally {
      asking = false;
      if (snapshot) draw(snapshot);
    }
  };

  /* ---- the list ---- */
  let titleProp = null, verdictOpts = [];
  // Pending writes are tracked here, NOT on the elements: a watch update redraws them, and a
  // redraw must not re-enable a control whose write is still in flight.
  let busy = false, snapshot = null;

  const draw = (snap) => {
    clearNotes();
    hintShown = false;
    titleProp = (snap.props.find((p) => p.type === 'title') || {}).name;
    const verdict = snap.props.find((p) => p.name === 'Verdict');
    verdictOpts = (verdict && verdict.options) || [];
    $('add').disabled = !titleProp || busy;
    if (!titleProp) show('bad', 'This database has no title column, so items cannot be named.');
    if (!canAsk) show('warn', 'This room cannot pass a question to an agent from a page yet, so the list works without it.');
    const open = snap.rows.filter((r) => !r.cells.Verdict || r.cells.Verdict === 'To review').length;
    $('sub').textContent = snap.rows.length + (snap.rows.length === 1 ? ' item' : ' items') + ', ' + open + ' to review';

    const list = $('list');
    list.textContent = '';
    if (!snap.rows.length) {
      const li = document.createElement('li');
      li.className = 'item';
      li.textContent = 'Nothing to review yet. Add the first item above.';
      list.appendChild(li);
      return;
    }
    snap.rows.forEach((row) => {
      const li = document.createElement('li');
      li.className = 'item';
      const top = document.createElement('div');
      top.className = 'top';
      const name = document.createElement('span');
      name.className = 'name';
      const title = (titleProp && row.cells[titleProp]) || 'Untitled';
      name.textContent = title;
      const chip = document.createElement('span');
      const st = row.cells.Verdict || 'To review';
      chip.className = 'chip' + (st === 'To review' ? '' : ' done');
      chip.textContent = st;
      top.appendChild(name); top.appendChild(chip);
      li.appendChild(top);

      const bits = [];
      if (row.cells.Notes) bits.push(String(row.cells.Notes));
      if (row.cells.Link) bits.push(String(row.cells.Link));
      if (bits.length) {
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = bits.join('  ·  ');
        li.appendChild(meta);
      }

      const actions = document.createElement('div');
      actions.className = 'row';
      verdictOpts.filter((o) => o.name !== st).forEach((o) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = o.name;
        b.setAttribute('aria-label', 'Mark ' + title + ' as ' + o.name);
        b.disabled = busy;
        b.onclick = async () => {
          if (busy) return;
          busy = true;
          b.disabled = true;
          // try/finally: a rejected write must still clear busy, or every control stays dead.
          let r = { ok: false, reason: '' };
          try {
            r = await save(() => db.write(id, row.id, 'Verdict', o.name));
          } catch (e) {
            r = { ok: false, reason: e.message || 'The change was refused.' };
          } finally {
            busy = false;
            if (snapshot) draw(snapshot);
          }
          if (!r.ok) show('bad', r.reason || 'The change was refused.');
        };
        actions.appendChild(b);
      });
      if (canAsk) {
        const ask = document.createElement('button');
        ask.type = 'button';
        ask.textContent = 'Ask my agent about this';
        ask.setAttribute('aria-label', 'Ask my agent about ' + title);
        ask.disabled = asking;
        ask.onclick = () => askAbout(row, title);
        actions.appendChild(ask);
      }
      li.appendChild(actions);

      const said = asked.get(row.id);
      if (said) {
        const line = document.createElement('div');
        line.className = 'asked' + (said[0] ? ' ' + said[0] : '');
        line.setAttribute('role', 'status');
        line.textContent = said[1];
        li.appendChild(line);
      }
      list.appendChild(li);
    });
  };

  const render = (snap) => {
    snapshot = snap;
    if (!snap) { clearNotes(); $('list').textContent = ''; $('sub').textContent = ''; show('bad', 'The Review database was removed from this room.'); $('add').disabled = true; return; }
    draw(snap);
  };

  db.onChange(id, render);                 // subscribe, then read: no edit is missed between them
  try { render(await db.read(id)); } catch (e) { $('sub').textContent = ''; show('bad', e.message); }
  if (canAsk) await loadAgents();

  $('add').onclick = async () => {
    if (busy) return;                                  // one item in flight at a time
    const text = $('title').value.trim();
    if (!text || !titleProp) return;
    const note = $('note').value.trim();
    const values = {};
    values[titleProp] = text;
    values.Verdict = 'To review';
    if (note) values.Notes = note;
    busy = true;
    $('add').disabled = true;
    let r = { ok: false, reason: '' };
    try {
      r = await save(() => db.createRow(id, values));
    } catch (e) {
      r = { ok: false, reason: e.message || 'The item was not saved.' };
    } finally {
      busy = false;
      if (snapshot) draw(snapshot);
    }
    if (!r.ok) { show('bad', r.reason || 'The item was not saved.'); return; }
    if ($('title').value.trim() === text) $('title').value = '';
    if ($('note').value.trim() === note) $('note').value = '';
  };
  $('title').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('add').click(); });
})();
</script>
</body>
</html>
