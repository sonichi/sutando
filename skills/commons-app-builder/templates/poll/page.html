<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poll</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfd; --card: #fff; --ink: #16161a; --dim: #5d5d6b;
    --line: #e3e3ea; --accent: #2f5bea; --warn: #8a5a00; --bad: #b3261e; --bar: #d8def8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111115; --card: #1a1a20; --ink: #f2f2f5; --dim: #a6a6b4;
      --line: #2c2c36; --accent: #7d9bff; --warn: #ffcf70; --bad: #ff8a80; --bar: #26314f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 19px; margin: 0 0 2px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 12px; overflow-wrap: anywhere; }
  .note { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin-bottom: 10px; font-size: 14px; }
  .note.bad { border-color: var(--bad); color: var(--bad); }
  .note.warn { border-color: var(--warn); color: var(--warn); }
  .choices { display: grid; gap: 10px; margin-bottom: 16px; min-width: 0; }
  button {
    font: inherit; color: inherit; min-height: 44px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); padding: 10px 12px; cursor: pointer; text-align: left;
  }
  button[disabled] { opacity: .55; cursor: not-allowed; }
  button.chosen { border-color: var(--accent); border-width: 2px; font-weight: 600; }
  /* Option names and voter names are other people's text: wrap rather than widen the page. */
  button, .res, .resTop, .resTop span { overflow-wrap: anywhere; min-width: 0; }
  .results { display: grid; gap: 8px; list-style: none; margin: 0 0 14px; padding: 0; }
  .res { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .resTop { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .track { margin-top: 6px; height: 8px; border-radius: 999px; background: var(--bar); overflow: hidden; }
  .fill { height: 100%; background: var(--accent); }
  .you { font-size: 12px; color: var(--dim); margin-left: 6px; }
  input {
    font: inherit; color: inherit; min-height: 44px; width: 100%; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); padding: 0 12px;
  }
  @media (min-width: 640px) { .choices { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); } }
</style>
</head>
<body>
<h1>Poll</h1>
<div class="sub" id="sub">Loading…</div>
<div id="notes"></div>
<ul class="results" id="results"></ul>
<div class="choices" id="choices"></div>
<input id="comment" placeholder="Add a comment (optional)" aria-label="Comment" autocomplete="off">
<script>
(async () => {
  const art = window.artifact;
  const db = art && art.db;
  const $ = (id) => document.getElementById(id);
  const notes = $('notes');
  const show = (cls, text) => {
    const el = document.createElement('div');
    el.className = 'note ' + cls;
    el.textContent = text;
    notes.appendChild(el);
  };
  const clearNotes = () => { notes.textContent = ''; };
  let hintShown = false;
  const hint = (text) => { if (!hintShown) { hintShown = true; show('warn', text); } };

  if (!db) {
    $('sub').textContent = 'Preview';
    show('warn', 'Open this page in s.space to vote: this is a preview with no data.');
    return;
  }
  await art.ready;

  const byName = (list, name) => (list.find((d) => d.name === name) || {}).id;
  let dbs = [];
  try { dbs = await db.list(); } catch (e) { show('bad', e.message); return; }
  const id = (art.app && art.app.database) || byName(dbs, 'Poll — Votes');
  if (!id) { $('sub').textContent = ''; show('bad', 'The "Poll — Votes" database is missing from this room.'); return; }

  const save = async (call) => {
    const until = Date.now() + 120000;
    for (;;) {
      const r = await call();
      if (r.ok || !/waiting for the viewer|rate limit|too many/i.test(r.reason || '') || Date.now() > until) return r;
      hint('Allow this page to edit data in this room, and your vote will save.');
      await new Promise((ok) => setTimeout(ok, 1500));
    }
  };

  let titleProp = null, myRow = null, consentKnown = true, busy = false, snapshot = null;

  // A voter's identity for counting. The created_by cell is account ids, stamped by the server,
  // so one vote per person can be counted without the viewer's consent (personId needs it).
  const voterKey = (cell) => (Array.isArray(cell) ? cell.join(',') : cell == null ? '' : String(cell));

  // One vote per voter: their last row wins. Snapshot order is the rows' insertion order.
  const counted = (rows) => {
    const latest = new Map();
    rows.forEach((r) => { latest.set(voterKey(r.cells['Created by']) || 'row:' + r.id, r); });
    return [...latest.values()];
  };

  // Who wrote each vote. personId rejects until the viewer allows the page, and then the page
  // cannot tell its own vote from anyone else's: it shows "?" rather than claiming none.
  // Resolved into locals and returned: renders overlap (each awaits personId row by row), so
  // writing shared state here would let a slower, older render overwrite a newer one.
  const findMine = async (snap) => {
    let mine = null;
    // The LAST of the viewer's rows, so "your vote" is the one the tally counts.
    for (const row of snap.rows) {
      try {
        const who = await art.personId(row.cells['Created by']);
        if (who && art.me && who === art.me.id) mine = row;
      } catch (e) { return { myRow: null, consentKnown: false }; }
    }
    return { myRow: mine, consentKnown: true };
  };
  let generation = 0;

  const lockChoices = () => {
    [...$('choices').children].forEach((el) => { el.disabled = true; });
  };
  const unlockChoices = () => {
    [...$('choices').children].forEach((el) => { el.disabled = false; });
  };

  const draw = (snap) => {
    clearNotes();
    hintShown = false;
    titleProp = (snap.props.find((p) => p.type === 'title') || {}).name;
    const choice = snap.props.find((p) => p.name === 'Choice');
    const options = (choice && choice.options) || [];
    if (!options.length) { show('bad', 'The Choice column has no options yet, so there is nothing to vote on.'); return; }

    // One row per vote, one vote per voter: repeat rows from one person count once.
    const tally = {};
    options.forEach((o) => { tally[o.name] = 0; });
    const votes = counted(snap.rows);
    let total = 0;
    votes.forEach((r) => {
      const c = r.cells.Choice;
      if (c && Object.prototype.hasOwnProperty.call(tally, c)) { tally[c] += 1; total += 1; }
    });
    const ignored = snap.rows.length - votes.length;

    $('sub').textContent = total + (total === 1 ? ' vote' : ' votes') +
      (consentKnown ? (myRow ? '  ·  you voted ' + myRow.cells.Choice : '  ·  you have not voted') : '  ·  your vote: ?');
    if (!consentKnown) show('warn', 'Allow the page to see who is who, and it will show your own vote and let you change it.');
    if (ignored > 0) show('warn', ignored + (ignored === 1 ? ' extra row' : ' extra rows') + ' from someone who already voted are not counted.');

    const res = $('results');
    res.textContent = '';
    if (!total) {
      const li = document.createElement('li');
      li.className = 'res';
      li.textContent = 'No votes yet. Pick an option below to be first.';
      res.appendChild(li);
    } else {
      options.forEach((o) => {
        const n = tally[o.name];
        const li = document.createElement('li');
        li.className = 'res';
        const top = document.createElement('div');
        top.className = 'resTop';
        const left = document.createElement('span');
        left.textContent = o.name;
        if (consentKnown && myRow && myRow.cells.Choice === o.name) {
          const you = document.createElement('span');
          you.className = 'you';
          you.textContent = '(yours)';
          left.appendChild(you);
        }
        const right = document.createElement('span');
        right.textContent = n + '  ·  ' + Math.round((n / total) * 100) + '%';
        top.appendChild(left); top.appendChild(right);
        const track = document.createElement('div');
        track.className = 'track';
        const fill = document.createElement('div');
        fill.className = 'fill';
        fill.style.width = Math.round((n / total) * 100) + '%';
        track.appendChild(fill);
        li.appendChild(top); li.appendChild(track);
        res.appendChild(li);
      });
    }

    const box = $('choices');
    box.textContent = '';
    options.forEach((o) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = (consentKnown && myRow && myRow.cells.Choice === o.name) ? o.name + ' — your vote' : o.name;
      if (consentKnown && myRow && myRow.cells.Choice === o.name) b.className = 'chosen';
      b.disabled = busy || (consentKnown && myRow && myRow.cells.Choice === o.name);
      b.setAttribute('aria-label', 'Vote for ' + o.name);
      b.onclick = async () => {
        if (busy) return;                                  // one vote in flight at a time
        busy = true;
        lockChoices();
        const comment = $('comment').value.trim();
        // Ownership is resolved inside the retried call: consent granted mid-retry turns this
        // from a second row into an edit of the voter's own.
        let commentResult = null;
        const r = await save(async () => {
          if (snapshot) {
            const who = await findMine(snapshot);
            myRow = who.myRow;
            consentKnown = who.consentKnown;
          }
          if (myRow) return db.write(id, myRow.id, 'Choice', o.name);
          const values = { Choice: o.name };
          if (titleProp) values[titleProp] = (art.me && art.me.name) || 'Vote';
          if (comment) values.Comment = comment;
          return db.createRow(id, values);
        });
        // The comment is its own write with its own retry, so retrying it never rewrites Choice,
        // and a refusal is reported instead of being dropped.
        if (r.ok && comment && myRow) {
          commentResult = await save(() => db.write(id, myRow.id, 'Comment', comment));
        }
        busy = false;
        // Re-draw from the current snapshot: a watch update during the write replaced the
        // buttons, and re-enabling the detached ones would leave the live set stuck disabled.
        if (snapshot) await render(snapshot);
        else unlockChoices();
        if (!r.ok) show('bad', r.reason || 'Your vote was not saved.');
        else if (commentResult && !commentResult.ok) {
          show('warn', 'Your vote was saved, but the comment was not: ' +
            (commentResult.reason || 'refused') + '. Your text is still in the box.');
        } else if (comment && $('comment').value.trim() === comment) $('comment').value = '';
      };
      box.appendChild(b);
    });
  };

  const render = async (snap) => {
    const gen = ++generation;                          // a newer render supersedes this one
    snapshot = snap;
    if (!snap) { clearNotes(); $('results').textContent = ''; $('choices').textContent = ''; $('sub').textContent = ''; show('bad', 'The Poll database was removed from this room.'); return; }
    const who = await findMine(snap);
    if (gen !== generation) return;                    // superseded while resolving ownership
    myRow = who.myRow;
    consentKnown = who.consentKnown;
    draw(snap);
  };

  db.onChange(id, render);
  try { await render(await db.read(id)); } catch (e) { $('sub').textContent = ''; show('bad', e.message); }
})();
</script>
</body>
</html>
