<!doctype html>
<!-- Sutando web companion — a minimal phone-browser SCP client.
     Served by the Server itself (GET /companion) so it shares the WSS origin.
     Auth: paste a pairing token (one-time; auto-redeems to a device credential
     stored in localStorage) or an existing credential. No CDN, no build. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sutando</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #0b0d10; color: #e8eaed; font: 16px/1.45 -apple-system, system-ui, sans-serif;
         max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; letter-spacing: .12em; text-align: center; margin: 8px 0 2px; }
  .sub { text-align: center; color: #9aa0a6; font-size: 12px; margin-bottom: 14px; }
  .card { background: #14171c; border: 1px solid #23272f; border-radius: 14px; padding: 14px; margin: 10px 0; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-right: 8px;
         background: #5f6368; vertical-align: -1px; }
  .dot.on { background: #34d399; } .dot.off { background: #f87171; } .dot.busy { background: #fbbf24; }
  #state { font-weight: 700; letter-spacing: .08em; }
  #step { color: #9aa0a6; font-size: 13px; margin-top: 4px; min-height: 18px; }
  input, textarea, button { font: inherit; border-radius: 10px; border: 1px solid #2c313a;
         background: #0f1216; color: #e8eaed; padding: 10px 12px; width: 100%; }
  button { background: #2563eb; border: 0; font-weight: 600; margin-top: 8px; cursor: pointer; }
  button.secondary { background: #23272f; }
  button.approve { background: #059669; width: 49%; } button.reject { background: #b91c1c; width: 49%; }
  .row { display: flex; gap: 2%; }
  #feed { font-size: 13px; max-height: 42vh; overflow-y: auto; }
  .evt { padding: 6px 8px; border-left: 3px solid #2c313a; margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
  .evt.result { border-color: #34d399; } .evt.act { border-color: #4b5563; color: #9aa0a6; }
  .evt.req { border-color: #fbbf24; background: #1c1a12; }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #9aa0a6; margin-bottom: 6px; }
  #authcard.hidden, .hidden { display: none; }
</style>
</head>
<body>
<h1>SUTANDO</h1>
<div class="sub" id="agent">&nbsp;</div>

<div class="card" id="authcard">
  <div class="lbl">Connect</div>
  <input id="token" placeholder="pairing token or device credential" autocomplete="off">
  <button onclick="connect()">Connect</button>
  <div id="autherr" style="color:#f87171;font-size:13px;margin-top:6px;"></div>
</div>

<div class="card hidden" id="statuscard">
  <div><span class="dot" id="dot"></span><span id="state">OFFLINE</span></div>
  <div id="step"></div>
</div>

<div class="card hidden" id="askcard">
  <div class="lbl">Ask / assign</div>
  <textarea id="task" rows="2" placeholder="Tell Sutando what to do…"></textarea>
  <button onclick="submitTask()">Send</button>
</div>

<div class="card hidden" id="voicecard">
  <div class="lbl">Voice</div>
  <button id="ptt" class="secondary">🎙 Start voice</button>
  <div id="voicestate" style="color:#a78bfa;font-size:13px;margin-top:6px;"></div>
  <div id="voicemsg" style="color:#9aa0a6;font-size:12px;margin-top:6px;"></div>
</div>

<div class="card hidden" id="feedcard">
  <div class="lbl">Live</div>
  <div id="feed"></div>
</div>

<script>
'use strict';
let ws = null, rpcId = 0, pend = {};
const $ = id => document.getElementById(id);
const wsUrl = t => (location.protocol === 'https:' ? 'wss://' : 'ws://')
                 + location.host + '/scp?token=' + encodeURIComponent(t);

function rpc(method, params) {
  return new Promise((res, rej) => {
    const id = 'w' + (++rpcId);
    pend[id] = { res, rej };
    ws.send(JSON.stringify({ jsonrpc: '2.0', id, method, params: params || {} }));
    setTimeout(() => { if (pend[id]) { pend[id].rej(new Error('timeout')); delete pend[id]; } }, 15000);
  });
}

function feed(cls, text) {
  const d = document.createElement('div');
  d.className = 'evt ' + cls; d.textContent = text;
  $('feed').prepend(d);
  while ($('feed').children.length > 60) $('feed').lastChild.remove();
}

function approvalCard(p) {
  const d = document.createElement('div');
  d.className = 'evt req';
  d.textContent = '⚠ ' + (p.requestType || 'request') + ': ' + (p.action || p.question || '')
                + (p.reason ? ' — ' + p.reason : '');
  const row = document.createElement('div'); row.className = 'row'; row.style.marginTop = '8px';
  for (const dec of ['approve', 'reject']) {
    const b = document.createElement('button');
    b.className = dec; b.textContent = dec === 'approve' ? 'Approve' : 'Reject';
    b.onclick = async () => {
      try {
        const r = await rpc('approval.respond', { requestId: p.requestId, decision: dec });
        d.textContent = '✔ ' + (p.action || '') + ' → ' + r.status; row.remove();
      } catch (e) { b.textContent = 'not permitted'; b.disabled = true; }
    };
    row.appendChild(b);
  }
  d.appendChild(row); $('feed').prepend(d);
}

function setState(s, cls) { $('state').textContent = s; $('dot').className = 'dot ' + (cls || ''); }

async function onOpen(token) {
  localStorage.setItem('scp_credential', token);
  $('authcard').classList.add('hidden');
  for (const id of ['statuscard', 'askcard', 'voicecard', 'feedcard']) $(id).classList.remove('hidden');
  const agent = localStorage.getItem('scp_agent');
  if (agent) $('voicemsg').textContent = 'agent: ' + agent;
  initVoiceUi();
  // Agent-first display: the paired agent (from pair.redeem) is the truth;
  // sutando.info's actorId can be a "local-agent" fallback — never show that.
  const pairedAgent = localStorage.getItem('scp_agent');
  if (pairedAgent) { $('agent').textContent = pairedAgent; }
  else {
    try {
      const i = await rpc('sutando.info');
      const aid = i.agentId || '';
      $('agent').textContent = aid === 'local-agent' ? '' : aid;
    } catch (e) {}
  }
  try { await rpc('client.hello', { device_type: 'web', capabilities: ['display', 'touch'] }); } catch (e) {}
  try {
    const st = await rpc('sutando.status');
    setState((st.status || 'unknown').toUpperCase(), st.status === 'running' ? 'on' : 'busy');
    $('step').textContent = st.step || '';
  } catch (e) { setState('UNKNOWN', 'busy'); }
  try { await rpc('task.subscribe', { results: true, activity: true, requests: true }); } catch (e) {}
}

// ── voice: media envelope + capture/playback ─────────────────────────────────
// Envelope (media_frame.py): [version=1][stream_type=1][stream_id u16 BE][payload]
const mfEncode = (sid, payload) => {
  const out = new Uint8Array(4 + payload.byteLength);
  out[0] = 1; out[1] = 1; out[2] = (sid >> 8) & 0xff; out[3] = sid & 0xff;
  out.set(new Uint8Array(payload), 4);
  return out.buffer;
};
const mfDecode = (buf) => {
  const b = new Uint8Array(buf);
  if (b.length < 4 || b[0] !== 1) return null;
  return { sid: (b[2] << 8) | b[3], payload: buf.slice(4) };
};

let voice = { sid: null, ctx: null, srcNode: null, proc: null, stream: null,
              playCursor: 0, live: false, sources: [] };

function pcmDownTo16k(f32, fromRate) {
  const ratio = fromRate / 16000, n = Math.floor(f32.length / ratio);
  const out = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const s = Math.max(-1, Math.min(1, f32[Math.floor(i * ratio)]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}

function playPcm24k(buf) {
  if (!voice.ctx) return;
  const i16 = new Int16Array(buf), f32 = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 0x8000;
  const ab = voice.ctx.createBuffer(1, f32.length, 24000);
  ab.getChannelData(0).set(f32);
  const src = voice.ctx.createBufferSource();
  src.buffer = ab; src.connect(voice.ctx.destination);
  const t = Math.max(voice.ctx.currentTime, voice.playCursor);
  src.start(t);
  voice.playCursor = t + ab.duration;
  voice.sources.push(src);
  src.onended = () => { voice.sources = voice.sources.filter(s => s !== src); };
}

// Interrupt: cut all scheduled reply audio NOW (server marks the turn; the
// browser's echo cancellation is what makes talk-over interruption safe).
function flushPlayback() {
  for (const s of voice.sources.splice(0)) { try { s.stop(); } catch (e) {} }
  voice.playCursor = 0;
}

// Toggle-live full-duplex voice: tap once → persistent session, talk
// naturally, interrupt by talking over the reply (browser AEC prevents the
// mic from hearing the speaker); tap again → end. Same session shape as the
// watch and glasses — the client stays a dumb mic/speaker.
async function voiceStart() {
  if (!window.isSecureContext) {
    $('voicemsg').textContent = 'mic needs https or localhost — use the :8443 page';
    return;
  }
  try {
    const r = await rpc('voice.open', {});
    voice.sid = r.streamId;
    voice.stream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    voice.ctx = voice.ctx || new (window.AudioContext || window.webkitAudioContext)();
    await voice.ctx.resume();
    voice.playCursor = 0;
    voice.srcNode = voice.ctx.createMediaStreamSource(voice.stream);
    voice.proc = voice.ctx.createScriptProcessor(4096, 1, 1);
    voice.proc.onaudioprocess = (e) => {
      if (!voice.live || voice.sid == null || !ws || ws.readyState !== 1) return;
      const i16 = pcmDownTo16k(e.inputBuffer.getChannelData(0), voice.ctx.sampleRate);
      ws.send(mfEncode(voice.sid, i16.buffer));
    };
    voice.srcNode.connect(voice.proc);
    voice.proc.connect(voice.ctx.destination);   // required to drive the graph
    voice.live = true;
    $('ptt').textContent = '⏹ End voice';
    $('voicestate').textContent = 'listening';
    $('voicemsg').textContent = 'talk naturally — interrupt by talking over the reply';
  } catch (e) { $('voicemsg').textContent = 'voice failed: ' + e.message; }
}

async function voiceStop() {
  voice.live = false;
  flushPlayback();
  try {
    if (voice.proc) { voice.proc.disconnect(); voice.proc = null; }
    if (voice.srcNode) { voice.srcNode.disconnect(); voice.srcNode = null; }
    if (voice.stream) { voice.stream.getTracks().forEach(t => t.stop()); voice.stream = null; }
  } catch (e) {}
  if (voice.sid != null) { try { await rpc('voice.close', { streamId: voice.sid }); } catch (e) {} }
  voice.sid = null;
  $('ptt').textContent = '🎙 Start voice';
  $('voicestate').textContent = '';
  $('voicemsg').textContent = '';
}

function initVoiceUi() {
  $('ptt').addEventListener('click', () => { voice.live ? voiceStop() : voiceStart(); });
}

function onMessage(ev) {
  if (ev.data instanceof ArrayBuffer) {          // media plane: downstream audio
    const f = mfDecode(ev.data);
    if (f && f.sid === voice.sid) playPcm24k(f.payload);
    return;
  }
  let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
  if (m.id && pend[m.id]) {
    const p = pend[m.id]; delete pend[m.id];
    m.error ? p.rej(new Error(m.error.message || 'error')) : p.res(m.result);
    return;
  }
  const p = m.params || {};
  if (m.method === 'voice.state') {
    $('voicestate').textContent = p.state || '';
    if (p.state === 'interrupted') flushPlayback();  // cut the dead turn's tail
    return;
  }
  if (m.method === 'task.result') feed('result', '✔ ' + (p.taskId || '') + '\n' + (p.result || '').slice(0, 400));
  else if (m.method === 'activity') { $('step').textContent = p.step || ''; feed('act', '⚙ ' + (p.step || '')); }
  else if (m.method === 'request.pending') approvalCard(p);
}

// Robust auth flow: always try pair.redeem first; if it fails (this is already
// a device credential, which cannot redeem), fall through to normal use.
async function onOpenSmart(token) {
  let redeemed = null;
  try { redeemed = await rpc('pair.redeem', { label: 'web-companion' }); } catch (e) { /* not a pairing token */ }
  if (redeemed && redeemed.credential) {
    // Agent-first storage: the credential belongs to an AGENT, not a machine.
    localStorage.setItem('scp_credential', redeemed.credential);
    if (redeemed.agent_id) localStorage.setItem('scp_agent', redeemed.agent_id);
    ws.close();
    setTimeout(() => start(redeemed.credential), 300);
    return;
  }
  await onOpen(token);
}

function start(token) {
  try { if (ws) ws.close(); } catch (e) {}
  ws = new WebSocket(wsUrl(token));
  ws.binaryType = 'arraybuffer';                 // media-plane frames
  ws.onopen = () => onOpenSmart(token);
  ws.onmessage = onMessage;
  ws.onclose = () => setState('OFFLINE', 'off');
  ws.onerror = () => { $('autherr').textContent = 'connection failed — check the token / network'; };
}

function connect() { const t = $('token').value.trim(); if (t) start(t); }
function submitTask() {
  const t = $('task').value.trim(); if (!t) return;
  rpc('task.submit', { task: t }).then(r => { feed('act', '→ submitted ' + r.taskId); $('task').value = ''; })
    .catch(e => feed('act', '✗ ' + e.message));
}

const saved = localStorage.getItem('scp_credential');
if (saved) { $('token').value = saved; start(saved); }

// Embed mode (?embed=1): the page becomes a compact in-chat CALL PANEL —
// agent + voice toggle + state + live feed. The host app supplies chat and
// text input beside it, so the ask/submit card is hidden. Pairing UI stays
// until a credential exists (first run needs it even embedded).
if (new URLSearchParams(location.search).get('embed')) {
  document.body.classList.add('embed');
  const style = document.createElement('style');
  style.textContent = `
    body.embed { padding: 8px; }
    body.embed h1 { font-size: 14px; margin: 4px 0; }
    body.embed #askcard { display: none !important; }
  `;
  document.head.appendChild(style);
}
</script>
</body>
</html>
