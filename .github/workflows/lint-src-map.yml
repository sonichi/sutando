name: lint-src-map

# CI lint: refuse PRs that leave docs/src-map.md stale relative to src/.
#
# src-map.md is GENERATED by scripts/gen-src-map.py from each module's own
# header comment. A map nobody regenerates is worse than no map at all, because
# it is confidently wrong — an agent trusts it, goes to the named file, and
# finds something else. AGENTS.md drifted for exactly this reason (a sync script
# existed, nothing ran it), so this one is wired up from the start.
#
# The check fires when an indexed source module is added, removed, renamed, or
# has its extracted purpose edited — all of which change the generated output.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-src-map:
    name: refuse docs/src-map.md stale vs src/
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify src-map is in sync
        run: python3 scripts/gen-src-map.py --check
