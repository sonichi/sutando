name: CI

on:
  pull_request:
  push:
    branches: [main]

# Tests must never emit product telemetry (no PostHog writes from CI).
env:
  SUTANDO_TELEMETRY: "0"

# A superseded push previously kept its runner until completion, so an active
# branch could hold several full CI runs at once and starve the ones that
# matter. Observed 2026-08-19: `fix/gateway-lane-restart-without-watcher-reap`
# held two in-flight CI runs at different heads simultaneously.
# `main` is deliberately NOT cancelled — every commit on it should be tested.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classifies the PR's diff once so the test jobs can skip their suites when no
  # suite can see the change. Every required check still reports: the jobs run,
  # only their heavy steps are skipped, so the aggregator and the coverage gate
  # turn green instead of hanging as "expected". `code=false` needs every changed
  # file to be a doc (docs/** or *.md) that no test or script names, because a
  # suite may pin a doc's wording (worker-pool-design-retractions does).
  changes:
    name: classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          code=true
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch -q origin "$BASE_REF"
            # --name-status --no-renames: a rename is a delete plus an add, and a
            # deleted or renamed doc may be linked from anywhere, so it is code.
            entries="$(git diff --name-status --no-renames "origin/$BASE_REF...HEAD")"
            if [ -n "$entries" ]; then
              code=false
              while IFS=$'\t' read -r status f; do
                [ -n "$f" ] || continue
                case "$status" in A|M) ;; *) code=true; break ;; esac
                case "$f" in
                  docs/*|*.md) ;;
                  *) code=true; break ;;
                esac
                # A doc named by code, a script, a skill, a test or a workflow is
                # code for CI's purposes. grep rc 1 is the only "not named"; a hit
                # (0) or an error (2) both run the suites.
                rc=0
                grep -rlqF --exclude-dir=node_modules -- "$(basename "$f")" src scripts skills tests packages .github 2>/dev/null || rc=$?
                if [ "$rc" -ne 1 ]; then
                  code=true; break
                fi
              done <<< "$entries"
            fi
            echo "changed entries: $(printf '%s\n' "$entries" | grep -c . || true)"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  typecheck-and-test:
    name: lints + typecheck
    runs-on: ubuntu-latest
    # 20, not 10: measured 2026-08-03, this job is at capacity on legitimate work,
    # not hanging. Run 30801403218 spent 3.9 min (node tests) + 3.2 min (python) +
    # 1.5 min (shell, cut off) + ~1.4 min setup = 10.0 min and was CANCELED mid-step.
    # Three of the last four canceled runs are this job at exactly 10.2 min.
    # A canceled job renders as `fail` in `gh pr checks`, so PRs read red for a
    # reason that has nothing to do with their code (#1414, #2561 both hit this).
    # Safe to raise only because every suite loop is now individually bounded at
    # 120s (shell already was; the python loop is bounded in this same PR) — so a
    # genuine hang still surfaces in ~2 min, not in 20.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Catches local-time timestamps mislabeled as UTC (issue #908 / #909).
      # No deps needed — runs on the runner's stock python3.
      - name: UTC timestamp check
        run: python3 scripts/check-utc-z-strftime.py

      # Keep the documentation hub, metadata catalog, and repository-local
      # Markdown links complete. The release skill uses the same audit during
      # its docs-impact pass, so local preparation and CI enforce one contract.
      - name: Documentation audit
        run: python3 skills/release/scripts/docs_audit.py

      # Fails if vault.sync.include carries a per-host-prone path without a
      # hostname qualifier (would collapse across hosts on pull-merge).
      # See docs/workspace-per-host-paths.md.
      - name: Per-host carried-path lint
        run: bash scripts/lint-vault-sync-paths.sh

      # Layer 3 (#1543): verifies that personal_path() call sites in source are
      # not classified into state/ by CLASS_RULES in sutando-migrate.sh.
      # No-op on branches where sutando-migrate.sh is absent.
      - name: CLASS_RULES vs reader-chain symmetry lint
        run: python3 scripts/lint-class-rules.py

      # Repo-scoped review checks: runs the machine-readable `checks:` block from
      # REVIEW.md (today: hardcoded-path scan) over the PR diff, so
      # the guide's lessons gate EVERY PR — not just reviews that use the codex
      # tool. `gh pr diff` needs no history/fetch-depth. PR events only (a push to
      # main has no PR diff). See docs + scripts/review-checks.sh.

      # Own step so a fetch failure is not reported as a review-checks finding.
      # Retries first: a transient must not train re-run-without-reading.
      - name: Fetch PR diff (precondition)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Invalidate before fetching: a survivor from an earlier run would be
          # indistinguishable from a good fetch if a later attempt half-wrote it.
          rm -f /tmp/review-pr.diff
          for attempt in 1 2 3; do
            if gh pr diff ${{ github.event.pull_request.number }} > /tmp/review-pr.diff; then
              exit 0
            fi
            echo "gh pr diff failed (attempt $attempt/3); retrying" >&2
            sleep $((attempt * 5))
          done
          echo "PRECONDITION FAILED: could not fetch the PR diff after 3 attempts." >&2
          echo "This is NOT a review-checks finding — nothing was scanned." >&2
          exit 1

      # REVIEW.md's machine-readable `checks:` block over the materialized diff.
      # The runner exits 2 on an empty diff, so nothing passes unscanned.
      - name: Review checks (REVIEW.md)
        if: github.event_name == 'pull_request'
        run: bash scripts/review-checks.sh --diff /tmp/review-pr.diff

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` installs deps AND optionalDependencies. This catches the
      # failure mode PR #234 introduced: a new static import of a package
      # that isn't actually resolvable from a clean checkout. If a PR adds
      # a dep but forgets to update package-lock.json (or forgets to use
      # lazy imports for optional deps), this step fails fast.
      - name: Install dependencies (clean)
        run: npm ci

      # Python test deps. Most tests are stdlib-only; only secret-scanner needs
      # detect-secrets, and only as a TEST/dev dep — the runtime soft-imports it
      # (vault degrades gracefully when it's absent). Installed inline here rather
      # than via a requirements.txt: it's a single dev-only package, so the file
      # was pure indirection. Still required after the test:ts split: the out-of-tree
      # Python steps above need these deps, even though this job no longer runs test:py.
      - name: Install Python test deps
        run: python3 -m pip install 'detect-secrets>=1.5.0' 'discord.py>=2.3' -r skills/room-collab/requirements.txt

      - name: Typecheck
        run: npm run typecheck

      # skills/*/scripts TS was previously invisible to tsc (tsconfig include
      # was src-only) — dead options like vadConfig/googleSearch on session
      # configs and broken imports slipped through to runtime. Issue #1586.
      - name: Typecheck skills
        run: npm run typecheck:skills

      # NOTE: ESLint runs in its own workflow (.github/workflows/eslint.yml), not
      # as a step here — so a lint failure surfaces as a named "eslint" check on
      # the PR rather than being buried inside this job's result.

      # Skill-manifest validator + its own test. The test lives next to the code
      # in scripts/ (not tests/), so the standalone-Python-test step below won't
      # discover it — wire both explicitly here. `--all --strict` validates every
      # skills/*/manifest.json (the path skills/MANIFEST.md documents) and fails on
      # warnings (e.g. a network permission that doesn't match the code).
      # Each call is wrapped in `timeout -k 5 120` for the same reason as the
      # discovered-suite loops below: this job's timeout-minutes is the only
      # other bound, so an unbounded hang here burns the whole job budget and
      # the job is CANCELED mid-step — which renders as `fail` and hides which
      # suite hung. These two steps are hand-wired lists rather than loops, so
      # they were missed when the loops were bounded.
      - name: Lint skill manifests
        run: |
          timeout -k 5 120 python3 scripts/lint-skill.test.py
          timeout -k 5 120 python3 scripts/lint-skill.py --all --strict
          # The rename keeps a few old spellings alive on purpose; this refuses NEW ones.
          timeout -k 5 120 python3 scripts/lint-old-collab-literals.py

  # The suites that used to run after the typecheck in the job above, now beside
  # it: three runners of ~2 min each instead of one of ~5, same commands, same env.
  node-and-oot-tests:
    name: node + out-of-tree python tests
    needs: changes
    # Job-level, not per step: a docs-only diff skips the whole runner, and the
    # aggregator below treats that skip as a pass only when `changes` said so.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (clean)
        run: npm ci

      - name: Install Python test deps
        run: python3 -m pip install 'detect-secrets>=1.5.0' 'discord.py>=2.3' -r skills/room-collab/requirements.txt

      # Python tests that live OUTSIDE tests/ and so are invisible to the
      # `find tests -name '*.test.py'` discovery. Same reason the skill-manifest
      # test is wired by hand. Without this they run only when someone
      # remembers to run them locally, which is indistinguishable from passing.
      # Notably src/remote-gateway-bridge.test.py — the suite the transport
      # change process requires for ANY package change — and tools/test_no_drift.py,
      # which is the guard against src/ and the package silently diverging.
      - name: Run out-of-tree Python tests
        run: |
          timeout -k 5 120 python3 src/remote-gateway-bridge.test.py
          timeout -k 5 120 python3 packages/ag2-sparrow/tests/test_gateway_status.py
          timeout -k 5 120 python3 packages/ag2-sparrow/tests/test_dns_timeout.py
          timeout -k 5 120 python3 packages/ag2-sparrow/tests/test_dns_fallback.py
          timeout -k 5 120 python3 packages/ag2-sparrow/tests/test_ack_retry.py
          timeout -k 5 120 python3 packages/ag2-sparrow/tests/test_inflight_recovery.py
          timeout -k 5 120 python3 packages/ag2-sparrow/tests/test_write_task_atomic.py
          timeout -k 5 120 python3 packages/ag2-sparrow/tests/test_pool_advertisement_push.py
          timeout -k 5 120 python3 packages/ag2-sparrow/tests/test_event_inbox_channel.py
          timeout -k 5 120 python3 packages/ag2-sparrow/tests/test_event_consumer.py
          timeout -k 5 120 python3 packages/ag2-sparrow/tests/test_event_wiring.py
          timeout -k 5 120 python3 packages/ag2-sparrow/tests/test_human_action.py
          timeout -k 5 120 python3 packages/ag2-sparrow/tests/test_launch_diagnostics.py
          timeout -k 5 120 python3 packages/ag2-sparrow/tests/test_vault_token_tier.py
          timeout -k 5 120 python3 packages/ag2-sparrow/tests/test_env_token_quotes.py
          timeout -k 5 120 python3 packages/ag2-sparrow/tools/test_no_drift.py
          timeout -k 5 120 python3 skills/agent-room-ops/test_room_ops.py
          timeout -k 5 120 python3 skills/make-viral-video/scripts/test_source_tag.py

      # TypeScript only. `npm test` also chains `npm run test:py`, and the
      # dedicated `python-standalone-tests` job below runs the identical
      # `find tests -name '*.test.py'` set — so calling `npm test` here ran all
      # 554 Python suites TWICE per CI run, in two jobs, doubling both wall
      # clock and the chance of meeting a flake. Measured on run 32204234502:
      # `python standalone tests` succeeded while this job failed, on the same
      # commit, with `python: 554 file(s) ran, failed: ...` — the same suite,
      # one run, two outcomes. Local `npm test` still runs both halves.
      - name: Run TypeScript tests
        run: npm run test:ts
        if: hashFiles('tests/**/*.test.ts') != ''


      # Run standalone ESM tests (*.test.mjs). Same gap as #1934, one extension
      # later: these suites existed and CI discovered none of them, so a .mjs
      # suite could fail at HEAD while the run reported green.
      - name: Run ESM standalone tests
        run: |
          failed=0
          while IFS= read -r f; do
            echo "→ $f"
            # Same `if ! output=$(...)` form as the shell step: a bare assignment
            # would abort the whole step under `bash -e` on the first failure and
            # mask every later suite.
            if ! output=$(timeout -k 5 300 node "$f" 2>&1); then
              echo "✖ esm test failed: $f"
              echo "$output"
              failed=1
            else
              # Every suite must contribute a visible verdict. With a narrower
              # pattern four of seven printed nothing, so a step that ran
              # everything looked like a loop that matched no files — a green
              # indistinguishable from absence. `tail -1` is the backstop for a
              # suite whose closing line matches none of these.
              echo "$output" | grep -E 'FAIL|^all ok|^all passed|^PASS' || echo "$output" | tail -1
            fi
          done < <(find tests -name '*.test.mjs' -not -path '*/node_modules/*' | sort)
          exit "$failed"

  shell-standalone-tests:
    name: shell tests (lanes)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (clean)
        run: npm ci

      - name: Install Python test deps
        run: python3 -m pip install 'detect-secrets>=1.5.0' 'discord.py>=2.3' -r skills/room-collab/requirements.txt

      # Run standalone shell tests (*.test.sh). Fixes issue #1934: these suites
      # existed but were never wired into CI (the discovery glob only covered
      # *.test.py and *.test.ts). Emit full output on failure so debugging
      # info isn't lost.
      - name: Run shell standalone tests
        run: |
          bash scripts/run-shell-suites.sh lanes

  shell-tail-tests:
    name: shell tests (serial tail)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The process-table suites run one at a time in the checkout; on their own
    # runner they no longer sit behind the typecheck job's lanes.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python test deps
        run: python3 -m pip install 'detect-secrets>=1.5.0' 'discord.py>=2.3' -r skills/room-collab/requirements.txt
      - name: Run shell standalone tests (serial tail)
        run: bash scripts/run-shell-suites.sh tail

  python-standalone-tests:
    name: python standalone tests (${{ matrix.shard }}/5)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Five runners, each a fifth of the files by measured cost; the
    # coverage-gate job combines every leg's data.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    # Split out of `tsc + tests` so the three suites run beside each other rather
    # than one after another. Same environment, same commands — only sequencing.
    # 20, not 15: the suite now runs under coverage instrumentation (the only
    # run of it per push; the diff-coverage job below consumes its data instead
    # of running the suite again), and instrumentation costs ~40% wall time.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      - name: Install dependencies (clean)
        run: npm ci


      - name: Install Python test deps
        run: python3 -m pip install coverage 'detect-secrets>=1.5.0' 'discord.py>=2.3' -r skills/room-collab/requirements.txt

      # watch-tasks-stream-config-hot-reload.test.py exercises the real
      # live-streaming fswatch path (no stub) -- ubuntu-latest does not ship
      # fswatch, so that test silently exercised nothing (its subprocess died
      # at exec with no writer, indistinguishable from "no event" downstream).
      - name: Install fswatch
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fswatch

      # Run standalone Python tests (*.test.py).
      # Covers telegram-bridge TOFU tri-state, slack-bridge tier-map, discord-bridge
      # access tiers, result-markers, secret-scanner, and more. See #897.
      #
      # Quiet mode: suppress PASS lines (only FAIL + summary shown) to keep CI
      # log compact across 32+ test files. Non-zero exit on any failure.
      - name: Run Python standalone tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # Records are collected per file and replayed SERIALLY in sorted
          # order below, so `failed_files` keeps its order.
          failed=0
          failed_files=()
          WORKERS="$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)"
          RECDIR="$(mktemp -d)"
          trap 'rm -rf "$RECDIR"' EXIT
          export RECDIR
          # `skills` too: a skill owns its own tests/, so a suite that moves into one
          # keeps running; the root is optional, so it is added only when present.
          bash scripts/discover-python-tests.sh > "$RECDIR/all"
          # Measured cost, heaviest first onto the lightest leg: every file lands in
          # exactly one leg, and the legs finish together instead of by line parity.
          bash scripts/shard-by-cost.sh 5 "${SHARD:-1}" tests/python-suite-costs.txt < "$RECDIR/all" > "$RECDIR/files"
          # Key on the LINE INDEX: `tr "/." "__"` maps tests/a/b and tests/a_b
          # alike, letting one worker's failing rc be overwritten.
          N="$(wc -l < "$RECDIR/files" | tr -d ' ')"
          # A zero-file discovery is never legitimate on this repo; treat it as
          # the runner never reaching the discovery call, not an empty suite.
          if [ "$N" -eq 0 ]; then
            echo "::error::discover-python-tests.sh found 0 files — refusing rather than silently passing an empty suite"
            exit 1
          fi
          # Per-file cap: without it one hung suite burns the job budget and
          # the job is CANCELED mid-suite. 240s, not 120s: instrumentation slows
          # race/bench-style tests well past their bare runtime (same cap as
          # scripts/coverage-gate.sh, which ran this suite before).
          FILE_TIMEOUT=240
          rm -f .coverage coverage.xml
          find . -maxdepth 1 -name '.coverage.*' -delete

          # Shared scheduler: one SERIAL worker per worktree, so a slot can never
          # hold two suites — and the regression drives this same script. Under
          # coverage.py, one fragment per file; parallel-suite-lane.sh brings the
          # worktrees' fragments home for the combine below.
          bash scripts/parallel-suite-lane.sh "$WORKERS" "$RECDIR/files" "$RECDIR" \
            env SUTANDO_TEST_SUBPROCESS_COVERAGE=1 PYTHONFAULTHANDLER=1 \
            timeout -k 5 -s ABRT "$FILE_TIMEOUT" python3 -m coverage run --rcfile=.coveragerc
          _idx=0
          while IFS= read -r f; do
            _idx=$((_idx + 1))
            rec="$RECDIR/$_idx"
            echo "→ $f ($(cat "$rec.time" 2>/dev/null || echo '?')s)"
            rc="$(cat "$rec.rc" 2>/dev/null || echo 1)"
            output="$(cat "$rec.out" 2>/dev/null || true)"
            echo "$output" | grep -E 'FAIL|^Results:' || true
            if [ "$rc" -ne 0 ]; then
              if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
                echo "::error::TIMED OUT (>${FILE_TIMEOUT}s): $f"
              else
                echo "::error::FAILED: $f (exit $rc)"
              fi
              if [ -n "$output" ]; then
                echo "$output"
              else
                echo "  (this test produced NO output — exited $rc silently)"
              fi
              failed_files+=("$f")
              failed=1
            fi
          done < "$RECDIR/files"
          if [ "$failed" -ne 0 ]; then
            # `::notice::`, not `::error::` — the per-file lines above are the real
            # annotations. Making the summary an error too would double every failure
            # in GitHub's annotation count, so the badge would misreport how many
            # tests actually failed. Review nit, and a correct one.
            echo "::notice::${#failed_files[@]} python test file(s) failed:"
            printf '  %s\n' "${failed_files[@]}"
            exit "$failed"
          fi
          # Green leg: merge the per-file fragments once, here; the
          # diff-coverage job combines the legs and measures this run.
          python3 -m coverage combine --quiet
          mv .coverage ".coverage.shard${SHARD:-1}"

      # `.coverage` is a dotfile, which upload-artifact v4 skips by default.
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  coverage-gate:
    name: diff coverage >= 95% (python)
    # Enforces >= 95% coverage on the Python lines this PR changes, judged from
    # the instrumented run above — the suite is never run a second time for
    # it. pull_request only: the gate is a diff against the PR's base branch.
    # See docs/testing-coverage.md.
    needs: [python-standalone-tests, changes]
    # A docs-only diff has no Python lines to measure; the required check reads
    # a skipped job as satisfied, and `changes` is what said the diff is docs.
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # diff-cover needs the base branch locally to compute changed lines.
          fetch-depth: 0

      - name: Install coverage tooling
        run: python3 -m pip install coverage diff-cover

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Run coverage gate
        env:
          BASE_REF: origin/${{ github.base_ref }}
          COVERAGE_GATE_PRECOMPUTED: "1"
        run: bash scripts/coverage-gate.sh

      # The companion workflow_run job (.github/workflows/coverage-comment.yml)
      # posts the summary as a sticky PR comment. Two-stage on purpose: fork PRs
      # run here with a read-only GITHUB_TOKEN, so the comment must be posted by
      # a workflow that runs in the base-repo context WITHOUT checking out PR code.
      - name: Stamp PR number for the comment workflow
        if: always()
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: |
            coverage-summary.md
            pr-number.txt
          if-no-files-found: ignore
          retention-days: 3

  required-tests:
    name: tsc + tests (clean install)
    # Carries the name the `main` ruleset requires. Splitting a suite into its
    # own job removes it from the required-context list; this keeps one gate
    # that fails when any suite fails, so a split cannot weaken protection.
    needs: [changes, typecheck-and-test, node-and-oot-tests, shell-standalone-tests, shell-tail-tests, python-standalone-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `needs.*.result` is checked explicitly: a job skipped because its
      # dependency failed reports "skipped", which a required check can treat
      # as satisfied. Failing here makes the outcome explicit either way.
      - name: Require every test job to have succeeded
        env:
          # A skip is a pass only when `changes` itself succeeded and said the
          # diff is docs; a `changes` failure leaves code empty, which is not that.
          DOCS_ONLY: ${{ needs.changes.result == 'success' && needs.changes.outputs.code == 'false' }}
        run: |
          set -euo pipefail
          # A cancelled job still blocks the merge — an unfinished run is not a
          # pass — but it must not READ as a test failure. A job cancelled at its
          # timeout-minutes cap, or by the new concurrency rule, is a CAPACITY
          # outcome; reporting it identically to an assertion failure is what let
          # #3146's incidents be counted as flaky tests.
          rc=0
          check() {
            case "$2" in
              success)   echo "  $1: success" ;;
              cancelled) echo "::warning::$1 was CANCELLED (job cap or superseded run) — capacity, not a test failure"; rc=1 ;;
              skipped)   if [ "$DOCS_ONLY" = "true" ] && [ "$1" != "changes" ]; then
                           echo "  $1: skipped (docs-only diff, nothing to run)"
                         else
                           echo "::error::$1 was SKIPPED — a dependency failed, so nothing ran"; rc=1
                         fi ;;
              *)         echo "::error::$1 FAILED ($2)"; rc=1 ;;
            esac
          }
          check "changes"                 "${{ needs.changes.result }}"
          check "typecheck-and-test"      "${{ needs.typecheck-and-test.result }}"
