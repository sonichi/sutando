name: CI

on:
  pull_request:
    branches: [main, staging-interaction-planes]
  push:
    branches: [main, staging-interaction-planes]

jobs:
  typecheck-and-test:
    name: tsc + tests (clean install)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Catches local-time timestamps mislabeled as UTC (issue #908 / #909).
      # No deps needed — runs on the runner's stock python3.
      - name: UTC timestamp check
        run: python3 scripts/check-utc-z-strftime.py

      # Keep the documentation hub, metadata catalog, and repository-local
      # Markdown links complete. The release skill uses the same audit during
      # its docs-impact pass, so local preparation and CI enforce one contract.
      - name: Documentation audit
        run: python3 skills/release/scripts/docs_audit.py

      # Fails if vault.sync.include carries a per-host-prone path without a
      # hostname qualifier (would collapse across hosts on pull-merge).
      # See docs/workspace-per-host-paths.md.
      - name: Per-host carried-path lint
        run: bash scripts/lint-vault-sync-paths.sh

      # Layer 3 (#1543): verifies that personal_path() call sites in source are
      # not classified into state/ by CLASS_RULES in sutando-migrate.sh.
      # No-op on branches where sutando-migrate.sh is absent.
      - name: CLASS_RULES vs reader-chain symmetry lint
        run: python3 scripts/lint-class-rules.py

      # Repo-scoped review checks: runs the machine-readable `checks:` block from
      # REVIEW.md (today: hardcoded-path scan) over the PR diff, so
      # the guide's lessons gate EVERY PR — not just reviews that use the codex
      # tool. `gh pr diff` needs no history/fetch-depth. PR events only (a push to
      # main has no PR diff). See docs + scripts/review-checks.sh.
      - name: Review checks (REVIEW.md)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        # Materialize the diff BEFORE scanning and fail closed if `gh pr diff`
        # errors (#2281, Qingyun review). The old `gh pr diff … | review-checks.sh`
        # pipe reported the pipeline's LAST exit status, so a failed `gh pr diff`
        # (auth/rate-limit/network) sent an empty diff to the scanner, which
        # printed "empty diff — nothing to check" and exited 0 → the gate passed
        # WITHOUT scanning the PR. `set -euo pipefail` + `--diff` closes that.
        run: |
          set -euo pipefail
          gh pr diff ${{ github.event.pull_request.number }} > /tmp/review-pr.diff
          bash scripts/review-checks.sh --diff /tmp/review-pr.diff

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` installs deps AND optionalDependencies. This catches the
      # failure mode PR #234 introduced: a new static import of a package
      # that isn't actually resolvable from a clean checkout. If a PR adds
      # a dep but forgets to update package-lock.json (or forgets to use
      # lazy imports for optional deps), this step fails fast.
      - name: Install dependencies (clean)
        run: npm ci

      # Python test deps. Most tests are stdlib-only; only secret-scanner needs
      # detect-secrets, and only as a TEST/dev dep — the runtime soft-imports it
      # (vault degrades gracefully when it's absent). Installed inline here rather
      # than via a requirements.txt: it's a single dev-only package, so the file
      # was pure indirection. Must run BEFORE `npm test`: the `test` script chains
      # `npm run test:py`, so Python tests execute inside the "Run tests" step.
      - name: Install Python test deps
        run: python3 -m pip install 'detect-secrets>=1.5.0' 'discord.py>=2.3'

      - name: Typecheck
        run: npm run typecheck

      # skills/*/scripts TS was previously invisible to tsc (tsconfig include
      # was src-only) — dead options like vadConfig/googleSearch on session
      # configs and broken imports slipped through to runtime. Issue #1586.
      - name: Typecheck skills
        run: npm run typecheck:skills

      # NOTE: ESLint runs in its own workflow (.github/workflows/eslint.yml), not
      # as a step here — so a lint failure surfaces as a named "eslint" check on
      # the PR rather than being buried inside this job's result.

      # Skill-manifest validator + its own test. The test lives next to the code
      # in scripts/ (not tests/), so the standalone-Python-test step below won't
      # discover it — wire both explicitly here. `--all --strict` validates every
      # skills/*/manifest.json (the path skills/MANIFEST.md documents) and fails on
      # warnings (e.g. a network permission that doesn't match the code).
      - name: Lint skill manifests
        run: |
          python3 scripts/lint-skill.test.py
          python3 scripts/lint-skill.py --all --strict

      # Python tests that live OUTSIDE tests/ and so are invisible to the
      # `find tests -name '*.test.py'` step below. Same reason the skill-manifest
      # test above is wired by hand. Without this they run only when someone
      # remembers to run them locally, which is indistinguishable from passing.
      # Notably src/remote-gateway-bridge.test.py — the suite the transport
      # change process requires for ANY package change — and tools/test_no_drift.py,
      # which is the guard against src/ and the package silently diverging.
      - name: Run out-of-tree Python tests
        run: |
          python3 src/remote-gateway-bridge.test.py
          python3 packages/ag2-sparrow/tests/test_gateway_status.py
          python3 packages/ag2-sparrow/tests/test_dns_timeout.py
          python3 packages/ag2-sparrow/tests/test_ack_retry.py
          python3 packages/ag2-sparrow/tests/test_inflight_recovery.py
          python3 packages/ag2-sparrow/tests/test_write_task_atomic.py
          python3 packages/ag2-sparrow/tests/test_event_inbox_channel.py
          python3 packages/ag2-sparrow/tests/test_event_consumer.py
          python3 packages/ag2-sparrow/tests/test_event_wiring.py
          python3 packages/ag2-sparrow/tests/test_human_action.py
          python3 packages/ag2-sparrow/tests/test_launch_diagnostics.py
          python3 packages/ag2-sparrow/tools/test_no_drift.py
          python3 skills/agent-room-ops/test_room_ops.py
          python3 skills/make-viral-video/scripts/test_source_tag.py

      - name: Run tests
        run: npm test
        if: hashFiles('tests/**/*.test.ts') != ''

      # Run standalone Python tests (*.test.py).
      # Covers telegram-bridge TOFU tri-state, slack-bridge tier-map, discord-bridge
      # access tiers, result-markers, secret-scanner, and more. See #897.
      #
      # Quiet mode: suppress PASS lines (only FAIL + summary shown) to keep CI
      # log compact across 32+ test files. Non-zero exit on any failure.
      - name: Run Python standalone tests
        run: |
          failed=0
          failed_files=""
          while IFS= read -r f; do
            echo "→ $f"
            # `if ! assignment=$(...)` exempts the command from `bash -e` (GitHub's
            # default for run: steps) while still capturing output + status. A bare
            # `output=$(python3 "$f")` aborts the whole step the instant a test
            # fails — before the `echo "$output"` below ever runs — so the failing
            # test's traceback is DISCARDED, every later test is skipped, and the
            # log shows only the bare `→ <file>` line. The shell-test step below
            # already uses this idiom for exactly this reason; this step was
            # missed. (Observed on a real CI run: a failure printed no output at
            # all, making it undiagnosable from the log.)
            # `cmd && rc=0 || rc=$?` exempts the command from `bash -e` (GitHub's
            # default for run: steps) while capturing BOTH output and the real exit
            # status. A bare `output=$(python3 "$f")` aborts the whole step the
            # instant a test fails — before the `echo "$output"` below ever runs —
            # so the failing test's traceback is DISCARDED, every later test is
            # skipped, and the log shows only the bare `→ <file>` line. The
            # shell-test step below already uses this idiom for exactly this reason;
            # this step was missed. (Observed on a real CI run: a failure printed no
            # output at all, making it undiagnosable from the log.)
            output=$(python3 "$f" 2>&1) && rc=0 || rc=$?
            # Always show FAIL lines and summary
            echo "$output" | grep -E 'FAIL|^Results:' || true
            if [ "$rc" -ne 0 ]; then
              # NAME THE FILE. A test that exits non-zero with NO output — sys.exit(1),
              # an uncaught SystemExit, a bare `raise` in a helper — was previously
              # invisible: the log showed only its `→` line, byte-identical to a
              # passing test, and the step exited 1 with nothing to point at. Measured
              # 2026-07-30 on a red `tsc + tests`: the whole step held 24 non-arrow
              # lines and every `Results:` line was a pass, so the failing file could
              # not be identified from the log at all.
              echo "::error::FAILED: $f (exit $rc)"
              if [ -n "$output" ]; then
                # Emit full output (PASS + FAIL + traceback) so debugging info isn't
                # dropped on ImportError / uncaught exception.
                echo "$output"
              else
                echo "  (this test produced NO output — exited $rc silently)"
              fi
              failed_files="${failed_files}  ${f}\n"
              failed=1
            fi
          done < <(find tests -name '*.test.py' -not -path '*/node_modules/*' | sort)
          if [ "$failed" -ne 0 ]; then
            echo "::error::python standalone tests failed:"
            printf "%b" "$failed_files"
          fi
          exit "$failed"

      # Run standalone shell tests (*.test.sh). Fixes issue #1934: these suites
      # existed but were never wired into CI (the discovery glob only covered
      # *.test.py and *.test.ts). Mirrors the Python step above — emit full
      # output on failure so debugging info isn't lost.
      - name: Run shell standalone tests
        run: |
          failed=0
          # Load the known-failures allowlist (suites that fail on ubuntu-latest
          # due to macOS-specific tooling or timing). Allowlisted suites still run
          # and their output is printed, but a failure does NOT set failed=1.
          # New regressions in the other suites still fail CI immediately.
          # Burn this list to zero: https://github.com/sonichi/sutando/issues/1934
          known_failures_file="tests/shell-ci-known-failures.txt"
          while IFS= read -r f; do
            echo "→ $f"
            # `if ! assignment=$(...)` exempts the command from `bash -e` (GitHub's
            # default for run: steps) while still capturing output + status. A bare
            # `output=$(bash "$f")` would abort the whole step on the first failing
            # suite — losing this step's diagnostics and masking every later suite.
            #
            # `timeout -k 5 120` bounds each suite: a hanging suite (e.g. a bounded-
            # runner test whose --max backstop misfires under CI) would otherwise
            # burn the whole job's timeout-minutes budget and get the job *canceled*
            # mid-suite — masking every later suite AND this step's own diagnostics,
            # the very failure this loop was written to avoid. On overrun timeout
            # SIGTERMs (then SIGKILLs after 5s) and returns 124, so the suite fails
            # loudly and in isolation instead of hanging CI.
            if ! output=$(timeout -k 5 120 bash "$f" 2>&1); then
              echo "✖ shell test failed: $f"
              echo "$output"
              # Only gate CI if this suite is not in the known-failures allowlist.
              if ! grep -qxF "$f" "$known_failures_file" 2>/dev/null; then
                failed=1
              else
                echo "  (known failure — not gating CI; see $known_failures_file)"
              fi
            else
              echo "$output" | grep -E 'FAIL|^Summary' || true
            fi
          done < <(find tests -name '*.test.sh' -not -path '*/node_modules/*' | sort)
          exit "$failed"
