name: lint-host-label

# CI lint: refuse PRs that reintroduce a raw hostname-slug derivation
# (`hostname | sed 's/\..*//'`) in AGENT-FACING instructions.
#
# The per-host directory slug MUST be resolved via the single source of truth
# `bash scripts/sutando-config.sh host-label` (→ src/util_paths.py:_host_label():
# $SUTANDO_HOST_LABEL > scutil LocalHostName > short hostname). The bare
# `hostname | sed` recipe drifts on DHCP macOS hosts (short name ≠ Bonjour
# LocalHostName) and strands per-host files in a ghost hosts/<label>/ dir the
# readers never consult — silent per-host data loss (#1745; docs fixed in #2136).
#
# `scripts/lint-host-label.sh --diff` scans ONLY added lines in the PR, and only
# markdown instruction files — legit CODE fallbacks (self-diagnose/gather.sh's
# scutil-first, hostname-on-Linux) are never flagged. This is the durability
# layer for #2136 so review-memory alone can't let the recipe creep back.

on:
  pull_request:
  push:
    branches: [main, staging-workspace-revamp]

jobs:
  lint-host-label:
    name: refuse raw hostname-slug recipe in agent docs
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout (with full history for base-ref diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run lint in --diff mode
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: bash scripts/lint-host-label.sh --diff
