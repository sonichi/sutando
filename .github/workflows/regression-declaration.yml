name: Regression declaration
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]
permissions:
  contents: read
concurrency:
  group: regression-declaration-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  declaration:
    name: regression declaration
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const isFix = /^fix(?:\([^)]*\))?!?:/i.test(pr.title) ||
              pr.labels.some(label => label.name.toLowerCase() === 'bug');
            if (!isFix) {
              core.info('Non-bug-fix PR: declaration exempt.');
              return;
            }
            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const field = name => {
              const match = body.match(new RegExp('^' + name + ':[ \t]*([^\\r\\n]+)', 'im'));
              const value = match ? match[1].trim() : '';
              return value && !/^(?:n\/a|none|todo|tbd|[-—]|<.*>)$/i.test(value);
            };
            if (field('Regression exception')) {
              core.info('Exception declared; existing reviewer must assess its reason.');
            } else if (field('Regression test') && field('Regression evidence')) {
              core.info('Test and evidence declared; existing reviewer must assess their validity.');
            } else {
              core.setFailed('Bug fix: provide Regression test: and Regression evidence:, or Regression exception: with a concrete reason. See CONTRIBUTING.md.');
            }
