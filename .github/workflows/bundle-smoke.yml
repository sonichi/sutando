# Guards `npm run build:bundle`: a new dependency or dynamic import must not
# break the bundled artifacts at release time. Path-gated to the inputs that can
# affect the bundle, so doc-only PRs don't pay for it.
name: bundle-smoke

on:
  # No branches filter on pull_request: a PR that touches bundle inputs gets the
  # smoke regardless of its base — including stacked PRs, whose base branch is
  # exactly where an unexercised test could otherwise slip through (#2208 P1:
  # base-retarget is an `edited` event this workflow never sees, so "it will run
  # after retarget" is false without this).
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'skills/phone-conversation/scripts/conversation-server.ts'
      - 'skills/quota-tracker/scripts/credential-proxy.ts'
      - 'scripts/build-bundle.mjs'
      - 'scripts/smoke-bundle.sh'
      - 'scripts/smoke-startup-gate.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bundle-smoke.yml'
  push:
    branches: [main, staging-interaction-planes]
    paths:
      - 'src/**'
      - 'skills/phone-conversation/scripts/conversation-server.ts'
      - 'skills/quota-tracker/scripts/credential-proxy.ts'
      - 'scripts/build-bundle.mjs'
      - 'scripts/smoke-bundle.sh'
      - 'scripts/smoke-startup-gate.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bundle-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # >= 22.5 required at runtime: src/conversation-store.ts uses the
          # node:sqlite builtin (added 22.5). Matches the bundled node pin.
          node-version: '22.17.0'
      - run: npm ci
      - name: bundle smoke (build + load each artifact under plain node)
        run: bash scripts/smoke-bundle.sh
      - name: startup-gate smoke (G1.5 bundled gate fail-closed both ways, #2205)
        run: SMOKE_GATE_CASE3=1 bash scripts/smoke-startup-gate.sh
