name: eslint

# CI lint: the general-purpose ESLint baseline over all first-party sources —
# TypeScript (src/, skills/, tests/) and plain JavaScript (.js/.mjs build
# scripts + the Electron overlay app, which tsc never sees).
#
# Distinct from the five lint-*.yml workflows, which are targeted greps for
# architectural rules (workspace resolution, host labels, home-path literals).
# This one runs the actual linter: unused vars, dead code, unreachable branches
# — the class of defect tsc does not catch.
#
# Config and the rationale for every relaxed rule live in eslint.config.mjs.
# Errors fail this check. no-explicit-any is an ERROR everywhere except the
# shrinking allowlist of files that predate the ratchet (see eslint.config.mjs)
# — those stay warnings so their count is visible without blocking.
#
# Runs as its own workflow (rather than a step inside ci.yml) so a lint failure
# surfaces as a named "eslint" check on the PR instead of being buried in the
# CI job — matching the one-workflow-per-lint convention above. Cost is one
# extra `npm ci`; the npm cache keeps it short.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eslint:
    name: eslint over first-party TS + JS
    runs-on: ubuntu-latest
    # `npm ci` alone spends ~4 min of a cold cache; a 5-min job cap left it
    # ~50s and GitHub reports the kill as `cancelled`, which reads as red.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A workflow-level `paths:` filter would never report this REQUIRED context,
      # stranding the PR — so the gate skips STEPS and the job still reports.
      - name: Decide whether this diff has anything to lint
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # Unknown or empty scope lints: a lookup that failed is not evidence
          # that no lintable file changed.
          if [ "${{ github.event_name }}" != "pull_request" ] \
             || ! gh pr diff "$PR" --name-only > /tmp/eslint-scope.txt \
             || ! grep -q . /tmp/eslint-scope.txt; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'Scope undetermined (or push to main) — linting.'
            exit 0
          fi
          # Everything ESLint reads: the sources its flat config matches, its own
          # config, the workflow, tsconfig, and the lockfile that pins the rules.
          if grep -qE '\.(ts|tsx|js|mjs|cjs)$|^eslint\.config\.mjs$|^package(-lock)?\.json$|^tsconfig[^/]*\.json$|^\.github/workflows/eslint\.yml$' /tmp/eslint-scope.txt; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No file ESLint reads changed — nothing to lint. Changed files:'
            cat /tmp/eslint-scope.txt
          fi

      - name: Setup Node
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (clean)
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Run ESLint
        if: steps.scope.outputs.run == 'true'
        run: npm run lint
