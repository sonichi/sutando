name: scratch-4568-margin-sweep
on: pull_request

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: python3 -m pip install 'detect-secrets>=1.5.0' 'discord.py>=2.3' -r skills/room-collab/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fswatch
      - name: margin sweep
        env:
          SUTANDO_TEST_RELOAD_PROBE: "1"
        run: python3 scratch-margin-sweep.py
